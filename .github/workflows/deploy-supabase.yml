name: Deploy Supabase (Database, Storage Buckets & Policies)

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/**'
      - 'app/backend/prisma/schema.prisma'
  workflow_dispatch:
    inputs:
      run_seed:
        description: 'Run initial database seed data (users, demo student, classes)'
        required: false
        type: boolean
        default: false

jobs:
  deploy-supabase:
    name: Deploy Schema & Buckets to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase Configuration & Migrations
        run: |
          echo "Checking Supabase migration files..."
          ls -la supabase/migrations/
          echo "Supabase config found:"
          cat supabase/config.toml

      - name: Deploy Migrations via Supabase CLI (Project Ref)
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != '' }}
        run: |
          echo "Linking to Supabase project ${{ secrets.SUPABASE_PROJECT_ID }}..."
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          
          echo "Pushing database migrations and storage bucket configurations..."
          if [ -n "${{ secrets.SUPABASE_DB_PASSWORD }}" ]; then
            supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
          else
            supabase db push
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy Migrations via Direct Database URL (Fallback / Alternative)
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' && env.SUPABASE_DB_URL != '' }}
        run: |
          echo "Applying migrations directly via database URL..."
          supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Apply Seed Data (Optional / Manual Trigger)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_seed == true }}
        run: |
          echo "Applying seed.sql to Supabase..."
          if [ -n "${{ secrets.SUPABASE_DB_URL }}" ]; then
            PGPASSWORD="${{ secrets.SUPABASE_DB_PASSWORD }}" psql "${{ secrets.SUPABASE_DB_URL }}" -f supabase/seed.sql
          elif [ -n "${{ secrets.SUPABASE_PROJECT_ID }}" ]; then
            supabase db execute --file supabase/seed.sql
          else
            echo "::warning ::Neither SUPABASE_DB_URL nor SUPABASE_PROJECT_ID configured for seeding."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Verify Deployment Health
        run: |
          echo "Supabase schema and storage bucket deployment completed successfully."

