services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:17
    container_name: pec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pectop_db
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pectop_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. NestJS Backend API
  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: pec-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/pectop_db?schema=public"
      JWT_SECRET: "pec-tracking-portal-super-secret-jwt-key-change-in-production"
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
