<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pecGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9221d"/>
      <stop offset="100%" stop-color="#82100d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded Brand Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#pecGrad)" filter="url(#shadow)" stroke="#fef3c7" stroke-width="1.5"/>

  <!-- Academic Graduation Cap Emblem -->
  <!-- Mortarboard Diamond -->
  <polygon points="32,15 50,23 32,31 14,23" fill="#ffffff" opacity="0.95"/>
  <!-- Cap Skull Cap Underneath -->
  <path d="M22,27 L22,35 C22,39 42,39 42,35 L42,27" fill="#ffffff" opacity="0.8"/>
  <!-- Tassel Ribbon & Bobble -->
  <path d="M47,24.5 L49,36" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
  <circle cx="49" cy="37" r="2" fill="#d97706"/>

  <!-- PEC Monogram Inset -->
  <text x="32" y="53" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="1">PEC</text>
</svg>
